<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f3f6" />
    <title>ASK 测试报告</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f1f3f6;
      }
      /* 深色 HUD（用户上次选择）：挂载前即生效，避免闪色 */
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0a0e17;
      }
    </style>
    <script>
      // 主题持久化：缺省白色（科技感做在浅色上）；用户切到深色后记住
      try {
        var t = localStorage.getItem('ask-report-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        /* localStorage 不可用（file:// 隐私模式等）→ 保持白色默认 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
