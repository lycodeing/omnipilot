# M1 中等用例：搜索全流程与发现页
# 页面数：首页 → 搜索页 → 输入建议 → 搜索结果 → 文章筛选 → 文章详情 → 详情滚动
#         → 结果页 → 首页 → 发现 → 文章榜（约 7-10 页）
# 功能点：launch / tap / input(yadb 中文输入+回读) / data_extract(ui) / scroll / swipe
#         / key(back) / 发现页二级导航 / ask 问答
name: M1-搜索全流程与发现页
steps:
  - ai: 启动稀土掘金（com.daimajia.gold）并等待首页稳定
  - ai: 点击顶部搜索框进入搜索页，等待稳定
  - ai: 在搜索框输入「Android」，等建议列表出现，然后点击「搜索」按钮
  - ai: 等结果页稳定后，用 data_extract（mode=ui）提取前几条结果的标题与作者，存为数据集 search_android
  - ai: 点击筛选分类「文章」，等列表刷新
  - ai: 点开第一篇文章进入详情，向下滚动两次阅读正文，截图一张
  - ai: 按返回键离开文章详情回到搜索结果页
  # 依据：掘金搜索结果页保留底部 Tab 栏（实测 run-034835/053551 截图确认），
  # 故从结果页可直接切「发现」，无需先回首页
  - ai: 点击底部Tab「发现」，进入后点击「文章榜」，等榜单加载
  - aiQuery: 文章榜前3名的标题是什么？搜索结果页顶部的筛选分类有哪几个？
  - ai: 回到首页：连续按返回键（最多4次，每次间隔1秒），直到屏幕出现「搜索稀土掘金」搜索框与推荐信息流（即首页）；若按4次后仍未到首页，点底部导航栏「首页」标签。不要点击任何文章内容
    until: text*=搜索稀土掘金
    maxRounds: 4
    batch: false
  - aiAssert: 数据集 search_android 至少3条且标题非空；文章详情正文区滚动过至少一屏；当前前台为 com.daimajia.gold
